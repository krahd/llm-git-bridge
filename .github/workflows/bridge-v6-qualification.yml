name: Bridge v6 qualification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-v6-regressions:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate all installer and migration shell syntax
        run: |
          for script in shell_bridge/install.sh shell_bridge/cutover.sh shell_bridge/migrate_v6_staging_atomic.sh shell_bridge/prepare_v6_on_mac.sh; do
            bash -n "$script"
          done
      - name: Run bridge Python regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          _LOCAL_EXECUTOR_NESTED_VALIDATION: '1'
        run: python3 -m unittest discover -s shell_bridge/tests -q
      - name: Run complete direct macOS sandbox suite (no nested bypass)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s shell_bridge/tests -q
      - name: Typecheck native approval application
        run: xcrun swiftc -typecheck -framework AppKit shell_bridge/approval_gui.swift
