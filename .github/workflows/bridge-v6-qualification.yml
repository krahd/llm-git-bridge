name: Bridge v6 qualification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-v6-regressions:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate all installer and migration shell syntax
        run: |
          for script in shell_bridge/install.sh shell_bridge/cutover.sh shell_bridge/migrate_v6_staging_atomic.sh shell_bridge/prepare_v6_on_mac.sh; do
            bash -n "$script"
          done
      - name: Run bridge Python regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          _LOCAL_EXECUTOR_NESTED_VALIDATION: '1'
        run: python3 -m unittest discover -s shell_bridge/tests -q
      - name: Verify direct macOS sandbox and workspace integration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s shell_bridge/tests -p 'test_bridge_legacy.py' -k read_only_sandbox_blocks_write_and_repository_scope_allows_only_repo -q
          python3 -m unittest discover -s shell_bridge/tests -p 'test_workspace.py' -k validation_shell_uses_private_home_without_login_profile -q
          python3 -m unittest discover -s shell_bridge/tests -p 'test_finish_v6.py' -k finish_publishes_validated_commit_and_immutable_receipt -q
      - name: Typecheck native approval application
        run: xcrun swiftc -typecheck -framework AppKit shell_bridge/approval_gui.swift
