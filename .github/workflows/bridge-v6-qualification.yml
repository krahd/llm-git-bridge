name: Bridge v6 qualification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: bridge-v6-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bridge-v6-regressions:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate all installer and migration shell syntax
        run: |
          # Validate every shell entrypoint, not only the historical shortlist.
          find shell_bridge -maxdepth 1 -type f -name '*.sh' -print0 |
            xargs -0 -n 1 bash -n
      - name: Compile all bridge and test Python sources before regressions
        run: |
          python3 -m compileall -q shell_bridge src tests
      - name: Run canonical repository regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Run bridge Python regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          _LOCAL_EXECUTOR_NESTED_VALIDATION: '1'
        run: python3 -m unittest discover -s shell_bridge/tests -q
      - name: Run complete direct macOS sandbox suite (no nested bypass)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s shell_bridge/tests -q
      - name: Execute bounded read-only macOS runtime inventory
        run: |
          bash shell_bridge/audit_runtime_processes.sh > "$RUNNER_TEMP/bridge-runtime-inventory.txt"
          grep -q 'inventory_only_no_mutation=1' "$RUNNER_TEMP/bridge-runtime-inventory.txt"
      - name: Typecheck native approval application
        run: xcrun swiftc -typecheck -framework AppKit shell_bridge/approval_gui.swift

  core-repository-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate bridge shell syntax on Linux
        run: |
          find shell_bridge -maxdepth 1 -type f -name '*.sh' -print0 |
            xargs -0 -n 1 bash -n
      - name: Compile canonical Python sources and tests
        run: python3 -m compileall -q src tests shell_bridge
      - name: Run portable pinned SSH helper and release acceptance regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_ssh_pinned_helper.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_v6_release_once.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_verify_v5_production_health.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_bridge_service_ownership.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_bridge_lock_observer.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_verify_unique_result.py -v
          PYTHONPATH=shell_bridge:shell_bridge/tests python3 -m unittest test_bridge_v5.MailboxLockMigrationTests -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_installer_preflight_guard.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_installer_reservation.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_shutdown_worker_drain.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_verify_quiescent_journal.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_logical_operation_v6.py -v
          PYTHONPATH=shell_bridge python3 -m unittest discover -s shell_bridge/tests -p test_atomic_durability_v6.py -v
      - name: Run canonical repository unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
